name: run

on:
  workflow_dispatch:
  schedule:
    - cron: '0/30 * * * *'
  pull_request:
    paths:
      - .github/workflows/run.yaml
  push:
    branches:
      - main
    paths:
      - .github/workflows/run.yaml

jobs:
  trigger-actions-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ case(github.ref == 'refs/heads/main', 'production', '') }}
    permissions:
      contents: write
      pull-requests: read
    steps:
      - if: github.ref == 'refs/heads/main'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: int128/trigger-actions-bot@a0eeb841041c9ced8a555ef94ad3e60ecc61595c # v2.15.0
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
